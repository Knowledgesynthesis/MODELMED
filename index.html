<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ModelMed — Clinical Prediction Models for Clinicians</title>
    <meta name="description" content="An evidence-based, interactive course for clinicians on building, validating, interpreting and appraising clinical prediction models and machine learning, and on causal inference and target trial emulation — with live labs and a model sandbox." />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="ModelMed — Clinical Prediction Models for Clinicians" />
    <meta property="og:description" content="15 evidence-based modules, 16 live labs and a full model-development sandbox — from prediction models to causal inference." />
    <script>
      // apply the stored theme before first paint to avoid a flash
      try {
        var s = JSON.parse(localStorage.getItem('modelmed-progress-v2') || '{}');
        var m = (s.state && s.state.theme) || 'system';
        if (m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ModelMed needs JavaScript to run its interactive labs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
